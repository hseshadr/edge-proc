[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edge-proc"
dynamic = ["version"]
description = "Local execution substrate: ship signed, content-addressed data bundles to devices with fail-closed verification and delta sync, then run search and ranking locally through a deterministic router."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harish Seshadri", email = "harish.seshadri@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.26.8",
    "edgeproc-core>=0.4.2",  # supported core line; earlier releases are superseded
]

[project.optional-dependencies]
localvec = [
    "faiss-cpu>=1.14.3",
    "filelock>=3.20",
    "sentence-transformers>=5.6.0",
    "torch>=2.13.0",
    "rank-bm25>=0.2",
    "numpy>=2.5.1",
]
bundles = [
    "httpx>=0.27",
    "structlog>=26.1.0",
    "cryptography>=50",  # floor only, never a ceiling — 50.0.0 is the first release clearing CVE-2026-69247
    "filelock>=3.20",
    "zstandard>=0.25",
    "packaging>=24",  # PEP 440 version comparison for anti-rollback (sync monotonicity)
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "xenon>=0.9",
    "radon>=6.0",
    "poethepoet>=0.48.0",
    "pyyaml>=6.0",  # tests/test_workflow_security.py parses .github/workflows/*.yml
    "hatchling==1.27.0",  # locked build backend used by Dagger with no isolation
    "pip-audit==2.9.0",  # locked dependency-audit executable and transitive graph
]

[project.scripts]
edgeproc = "edgeproc.cli:app"

[project.urls]
Homepage = "https://github.com/hseshadr/edge-proc"
Repository = "https://github.com/hseshadr/edge-proc"
Issues = "https://github.com/hseshadr/edge-proc/issues"

# edgeproc-core installs from PyPI. Co-developing it locally? Clone it next to
# this repo and add a path override (uncomment):
#   [tool.uv.sources]
#   edgeproc-core = { path = "../shared-libs-python", editable = true }

# The version is single-sourced from edgeproc/_version.py — hatchling reads it at
# build time, so installed metadata and edgeproc.__version__ can never drift.
[tool.hatch.version]
path = "edgeproc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["edgeproc"]

[tool.hatch.build.targets.sdist]
# Ship the package plus the complete support surface consumed by the included test suite.
# A source archive that contains tests but omits their benchmarks, docs, workflow fixtures,
# policy documents, mutation harness, or lockfile is not independently testable.
only-include = [
  ".env.example",
  ".github/workflows",
  "CITATION.cff",
  "CLAUDE.md",
  "ROADMAP.md",
  "SECURITY.md",
  "benchmarks",
  "docs",
  "edgeproc",
  "tests",
  "examples",
  "scripts",
  "uv.lock",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", ".deps"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL", "A", "PT"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "C901", "PLR0911", "PLR0912"]
# Typer turns one parameter into one CLI flag, so a command with many flags has a wide
# signature by construction. Typer only ever binds them by keyword, so the positional-arg
# footgun PLR0917 warns about cannot happen here. Scoped to the CLI so the rule still
# guards the rest of the package.
"edgeproc/cli/*" = ["PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faiss", "rank_bm25", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=edgeproc",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "-v",
]

[tool.coverage.run]
source = ["edgeproc"]
omit = ["*/tests/*", "*/__pycache__/*"]
# Statement coverage only proves a line RAN; branch coverage proves both outcomes of
# each decision were taken. For a fail-closed substrate the untaken edge is exactly the
# one that matters — the `if not verified: refuse` that never got exercised.
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",
]
fail_under = 90.0

[tool.poe.tasks]
lint = "ruff check edgeproc/ tests/ scripts/release_contract.py"
fmt-check = "ruff format --check edgeproc/ tests/ scripts/release_contract.py"
fmt = "ruff format edgeproc/ tests/ scripts/release_contract.py"
complexity = "xenon --max-absolute A --max-modules A --max-average A edgeproc/"
test = "pytest"
# `gate` mirrors CI exactly (lint + format-check + typecheck + complexity + test).
gate = ["lint", "fmt-check", "typecheck", "complexity", "test"]
# Breaks one real guard at a time and checks the suite goes red. Deliberately NOT in
# `gate`: it re-runs the suite once per mutation (minutes, not seconds), so it stays an
# opt-in measurement rather than a per-commit tax.
mutants = "python scripts/mutation_harness.py"

# edgeproc-core installs from PyPI (or a plain path override) into
# site-packages, so it's on the normal import path and mypy resolves it directly —
# no MYPYPATH needed. (mypy refuses a MYPYPATH that points into site-packages, which
# is exactly what the old __file__-derived dance produced under a non-editable install.)
[tool.poe.tasks.typecheck]
cmd = "mypy --strict edgeproc/ scripts/release_contract.py"
