name: Dagger release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag identifying exact current main
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Dagger release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          verb: call
          args: >-
            release-candidate --tag=${{ inputs.tag }} --commit-sha=${{ github.sha }}
            --github-token=env:GITHUB_TOKEN export --path=release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-proc-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1
